<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - BOOBTONE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo"><img src="boobtone.jpg"width="90"height="70">
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
                <li><a href="bookings.html" class="btn-primary">Bookings</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <div class="section-title">
            <span>GET IN TOUCH</span>
            <h2>Contact Us</h2>
        </div>
        <div style="max-width: 600px; margin: 0 auto; background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
            <form onsubmit="event.preventDefault(); alert('Thank you for contacting BOOBTONE!');">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea rows="5" placeholder="How can we help you?" required></textarea>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; border: none; cursor: pointer;">Send Message</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 BOOBTONE (PTY) LTD. All Rights Reserved.Designed for quality home services.</p>
    </footer>
</body>
</html>
