<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookings - BOOBTONE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo"><img src="boobtone.jpg"width="90"height="70">
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="bookings.html" class="btn-primary active">Bookings</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <div class="section-title">
            <span>SCHEDULE A SERVICE</span>
            <h2>Book a Home Service</h2>
        </div>
        <div style="max-width: 600px; margin: 0 auto; background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
            <form onsubmit="event.preventDefault(); alert('Booking request submitted successfully!');">
                <div class="form-group">
                    <label>Select Service</label>
                    <select required>
                        <option value="">Select a service...</option>
                        <option value="plumbing">Plumbing Services</option>
                        <option value="cleaning">Cleaning Services</option>
                        <option value="repair">Home Repair & Maintenance</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="Your name" required>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" placeholder="Your phone number" required>
                </div>
                <div class="form-group">
                    <label>Preferred Date</label>
                    <input type="date" required>
                </div>
                <div class="form-group">
                    <label>Details / Specific Issues</label>
                    <textarea rows="4" placeholder="Describe what you need help with..."></textarea>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; border: none; cursor: pointer;">Submit Booking Request</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 BOOBTONE (PTY) LTD. All Rights Reserved.Designed for quality home services.</p>
    </footer>
</body>
</html>
